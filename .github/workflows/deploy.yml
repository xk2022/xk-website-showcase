name: Showcase Hub
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      preserve_publication:
        description: 'Preserve the fixed last verified public Showcase output as static snapshots; skips Pages'
        required: false
        type: boolean
        default: false
      static_artifact_project:
        description: 'Reviewed private-source project to publish (used only with a blob)'
        required: false
        type: choice
        options:
          - shengfengyang
          - esan-interior
          - hongjia-brand
          - carpentry
          - longtong-logistics
          - guanghai-software
          - hongjia-birdnest
          - little-me-owner-demo
          - rui-cafe
          - qiangang-windows
          - rotaract
          - consulting-chengce
          - honest
          - taiyang-logistics
          - truck-transport
        default: shengfengyang
      static_artifact_blob:
        description: 'Optional reviewed static ZIP Git blob SHA; skips website publication'
        required: false
        type: string
        default: ''
      static_artifact_sha256:
        description: 'Expected SHA-256 of the reviewed static ZIP'
        required: false
        type: string
        default: ''
      static_artifact_source:
        description: 'Exact private source commit represented by the static ZIP'
        required: false
        type: string
        default: ''

permissions:
  contents: read

# Serialize the entire public release, including source resolution and build.
# Do not cancel an in-flight Pages deployment; a queued newer run follows it.
concurrency:
  group: showcase-${{ github.event_name == 'pull_request' && github.ref || 'publication' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  preserve-published-snapshots:
    if: github.event_name == 'workflow_dispatch' && inputs.preserve_publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      actions: read
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Preserve only the pinned previously published static snapshots
        run: node scripts/preserve-published-snapshots.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain candidate pinned registrations
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: preserved-registrations
          path: .release/preserved-registrations.json
          include-hidden-files: true
          retention-days: 14

  publish-static-artifact:
    if: github.event_name == 'workflow_dispatch' && inputs.static_artifact_blob != '' && !inputs.preserve_publication
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - name: Validate reviewed static bytes and publish a pinned release asset
        run: node scripts/publish-static-artifact.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_PROJECT: ${{ inputs.static_artifact_project }}
          INPUT_BLOB_SHA: ${{ inputs.static_artifact_blob }}
          INPUT_SHA256: ${{ inputs.static_artifact_sha256 }}
          INPUT_SOURCE_SHA: ${{ inputs.static_artifact_source }}

  resolve:
    if: github.event_name != 'workflow_dispatch' || (inputs.static_artifact_blob == '' && !inputs.preserve_publication)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - run: node --test --test-isolation=none tests/*.test.mjs
      - name: Snapshot exact public source revisions and require configured source CI
        run: node scripts/resolve-sources.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Retain resolved release plan
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: resolved-sources
          path: .release/resolved-sites.json
          include-hidden-files: true
          retention-days: 14

  build:
    needs: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolved-sources
          path: .release
      - name: Install screenshot browser
        run: npm ci && npx playwright install --with-deps chromium
      - name: Build detached exact source commits without API credentials
        run: node scripts/build-showcases.mjs .release/resolved-sites.json
      - name: Run exact transport source browser suite against Hub output
        run: node scripts/test-transport.mjs .release/resolved-sites.json --install-browsers
      - name: Retain transport browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: transport-browser-report
          path: |
            .release/transport-report/
            .release/transport-test-results/
          include-hidden-files: true
          retention-days: 14
      - name: Verify Chengce client website at mobile and desktop widths
        run: node scripts/test-chengce.mjs dist
      - name: Retain Chengce browser report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: chengce-browser-report
          path: .release/chengce-report/
          include-hidden-files: true
          retention-days: 14
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b
        if: github.event_name != 'pull_request'
        with:
          path: dist

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main' && (github.event_name != 'workflow_dispatch' || (inputs.static_artifact_blob == '' && !inputs.preserve_publication))
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: resolved-sources
          path: .release
      - name: Reject a superseded Hub revision or release request
        run: node scripts/assert-current-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
      - name: Verify public source manifest, routes and referenced assets
        run: node scripts/verify-publication.mjs .release/resolved-sites.json

  verify-shop:
    needs: deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
      - id: shop
        run: node -e "console.log('revision=' + require('./config/showcases.json').find(s=>s.slug==='little-me-shop').ref)" >> "$GITHUB_OUTPUT"
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          repository: xk2022/xk-shop-little-me
          ref: ${{ steps.shop.outputs.revision }}
          path: shop
          persist-credentials: false
      - run: npm ci
      - name: Verify public mobile shopping and local receipt
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
          NODE_PATH: ${{ github.workspace }}/node_modules
        run: node shop/tests/e2e/pages-demo.cjs https://showcase.xplorekaleidoscope.com/little-me-shop/
